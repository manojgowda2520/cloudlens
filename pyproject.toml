[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudlens"
version = "0.2.0.dev0"
description = "One local dashboard for every AWS account: inventory, security posture and cost"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34.0",
    "prometheus-client>=0.20.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[apigateway,cognitoidp,cloudformation,resourcegroupstaggingapi,ec2]>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
cloudlens = "cloudlens.cli:main"

[tool.setuptools.packages.find]
include = ["cloudlens*"]

[tool.setuptools.package-data]
"cloudlens.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B023", "E731"]
