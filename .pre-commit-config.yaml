repos:
  - repo: local
    hooks:
      - id: no-account-ids
        name: no real AWS account IDs
        entry: python scripts/check_account_ids.py
        language: system
        pass_filenames: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
